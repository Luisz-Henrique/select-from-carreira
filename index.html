<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SELECT * FROM carreira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/alasql@4.4.0/dist/alasql.min.js"></script>
<style>
:root{
  --bg:#d6dce6;--surface:#f5f7fb;--surface2:#e6eaf1;--ink:#1b2233;--muted:#56607a;--edge:#1b2233;--drop:#1b2233;
  --blue:#2b59c3;--blue-ink:#ffffff;--money:#1f7a45;--alert:#bf3029;--hi:#ffd23f;--hi-ink:#1b2233;
  --code:#101833;--code-ink:#e6ecf8;--code-mute:#8ea0c4;--hud:#2d3448;--hud-ink:#f2f4f8;
  --pixel:"Press Start 2P",ui-monospace,"Courier New",monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161f;--surface:#1a2130;--surface2:#232c3e;--ink:#e6ebf5;--muted:#9ba6bd;--edge:#56637f;--drop:#04060a;
  --blue:#5b85ea;--money:#55c785;--alert:#f06a61;--code:#0a0f1f;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#11161f;--surface:#1a2130;--surface2:#232c3e;--ink:#e6ebf5;--muted:#9ba6bd;--edge:#56637f;--drop:#04060a;--blue:#5b85ea;--money:#55c785;--alert:#f06a61;--code:#0a0f1f;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:13px}
#app{max-width:1280px;margin:0 auto;padding:12px}
/* HUD */
.hud{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--hud);color:var(--hud-ink);padding:10px 14px;border:2px solid #10141f;box-shadow:4px 4px 0 var(--drop)}
.brand{font-family:var(--pixel);font-size:11px;letter-spacing:.02em;color:var(--hi);margin-right:auto;line-height:1.6}
.hud-stats{display:flex;gap:18px;align-items:center;font-family:var(--pixel);font-size:10px;flex-wrap:wrap}
#hDay{font-family:var(--sans);font-size:14px;font-weight:600}
#hClock{background:#10141f;padding:6px 8px;color:#9fe3b6}
#hMoney{color:var(--hi)}#hMoney.neg{color:#ff8a80}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:14px;align-items:start}
.stage{position:relative;border:2px solid #10141f;box-shadow:4px 4px 0 var(--drop);background:#2d3448;line-height:0;width:100%;max-width:calc((100vh - 120px) * 1.5);justify-self:center}

.screen{position:relative}
#cv{width:100%;height:auto;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
/* SIDE */
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--drop);padding:12px}
.me{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center}
#mePort{width:56px;height:56px;image-rendering:pixelated;background:var(--surface2);border:2px solid var(--edge)}
#meNome{font-weight:700;font-size:16px;line-height:1.2}#meCargo{color:var(--blue);font-weight:600;font-size:14px}#meSal{font-size:12px;color:var(--muted);line-height:1.35}
.stat{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font-size:13px;margin-top:8px}
.meter{position:relative;height:14px;background:var(--surface2);border:2px solid var(--edge)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--money);transition:width .3s}
.meter b{position:absolute;right:4px;top:-1px;font:9px/14px var(--pixel);color:var(--ink)}
.meter.low i{background:var(--alert)}
#barChefe i{background:var(--blue)}
.sk{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;margin-bottom:7px}
.sk .lv{font:9px/1.8 var(--pixel);color:var(--muted)}
.bar{grid-column:1/-1;height:6px;background:var(--surface2);border:1px solid var(--edge)}
.bar i{display:block;height:100%;background:var(--blue)}
.side h3{margin:0 0 8px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.side h3 b{font:10px/1.6 var(--pixel);background:var(--hi);color:var(--hi-ink);padding:0 6px}
#missList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
#missList li{display:grid;grid-template-columns:auto 1fr;gap:0 8px;font-size:13px;line-height:1.3;padding-bottom:6px;border-bottom:1px dashed var(--muted)}
#missList li:last-child{border-bottom:0}
#missList .mt{font-weight:600}#missList .mf{grid-column:2;color:var(--muted);font-size:12px}
#missList .empty{display:block;color:var(--muted);border:0}
.due{font:8px/1.9 var(--pixel);padding:2px 5px;background:var(--surface2);align-self:start;white-space:nowrap}
.due.hot,.ib-due.hot{background:var(--alert);color:#fff}.due.warm,.ib-due.warm{background:var(--hi);color:var(--hi-ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:2px solid var(--edge);background:var(--surface);padding:8px 12px;box-shadow:3px 3px 0 var(--drop);font-weight:600;font-size:14px;line-height:1.2}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--drop)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--drop)}
.btn.primary{background:var(--blue);color:var(--blue-ink)}
.btn.ghost{box-shadow:none;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.glow{background:var(--hi);color:var(--hi-ink)}
/* DPAD */
.dpad{display:none;position:absolute;left:10px;bottom:10px;width:132px;height:132px;line-height:1}
.dpad button{position:absolute;width:44px;height:44px;background:rgba(16,20,31,.72);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button.on{background:rgba(255,210,63,.85);color:#1b2233}
.dpad [data-d=Up]{left:44px;top:0}.dpad [data-d=Down]{left:44px;top:88px}.dpad [data-d=Left]{left:0;top:44px}.dpad [data-d=Right]{left:88px;top:44px}
#btnA{display:none;position:absolute;right:14px;bottom:30px;width:62px;height:62px;border-radius:50%;background:rgba(255,210,63,.9);border:3px solid #1b2233;font:14px var(--pixel);color:#1b2233;touch-action:manipulation}
@media (pointer:coarse){.dpad,#btnA{display:block}}
@media (pointer:coarse) and (max-width:900px){.screen{padding-bottom:142px}.dpad{bottom:6px;left:14px}#btnA{bottom:40px;right:24px;width:66px;height:66px}}
/* DIALOG */
.dialog{position:absolute;left:3%;right:3%;bottom:3%;background:#fbf7ec;color:#1b2233;border:3px solid #1b2233;box-shadow:0 0 0 3px #c79a5b,5px 5px 0 3px #1b2233;display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px;line-height:1.45;cursor:pointer;z-index:5}
.dialog[hidden]{display:none}
#dlgPort{width:84px;height:84px;image-rendering:pixelated;background:#e5d6b6;border:2px solid #1b2233}
#dlgName{font:10px/1.6 var(--pixel);color:#8a4b14;margin-bottom:4px}
#dlgText{font-size:16px;min-height:3em;max-width:68ch}
#dlgNext{position:absolute;right:12px;bottom:8px;font:10px var(--pixel);color:#8a4b14;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#dlgChoices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.choice{border:2px solid #1b2233;background:#fff;padding:7px 12px;font-weight:600;font-size:14px;box-shadow:2px 2px 0 #1b2233;text-align:left;color:#1b2233}
.choice:hover,.choice:focus-visible{background:var(--hi)}
/* MODAL */
.modal{position:fixed;inset:0;background:rgba(10,14,24,.55);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px));z-index:20}
.modal[hidden]{display:none}
.win{background:var(--surface);border:2px solid var(--edge);box-shadow:6px 6px 0 var(--drop);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column}
.modal.wide .win{width:min(980px,100%)}
.titlebar{display:flex;align-items:center;gap:10px;background:var(--hud);color:var(--hud-ink);padding:8px 10px;border-bottom:2px solid var(--edge)}
#modalTitle{font:10px/1.6 var(--pixel);margin:0;flex:1}
#modalClose{border:2px solid #10141f;background:#d6453d;color:#fff;width:28px;height:24px;font:12px var(--pixel);line-height:1}
#modalBody{overflow:auto;padding:16px;flex:1;min-height:0}
.modal.pc #modalBody{padding:0}
#modalActions{display:flex;justify-content:flex-end;gap:10px;padding:12px 16px;border-top:2px solid var(--edge);flex-wrap:wrap}
#modalActions[hidden]{display:none}
/* PC */
.pc-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:min(620px,78vh)}
.pc-nav{background:var(--surface2);border-right:2px solid var(--edge);display:flex;flex-direction:column;padding:10px;gap:6px}
.pc-nav button{text-align:left;border:2px solid transparent;background:none;padding:8px 10px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.pc-nav button.on{border-color:var(--edge);background:var(--surface);box-shadow:2px 2px 0 var(--drop)}
.pc-nav button b{font:9px/1.9 var(--pixel);background:var(--hi);color:var(--hi-ink);padding:0 5px}
.pc-energy{margin-top:auto;font-size:13px;color:var(--muted)}.pc-energy strong{color:var(--ink);font-family:var(--pixel);font-size:10px}
.pc-main{padding:16px 18px;overflow:auto;min-width:0}
.inbox{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.inbox button{width:100%;display:grid;grid-template-columns:28px 140px 1fr auto;grid-template-areas:"p f t g" "p f d r";gap:2px 12px;align-items:center;text-align:left;border:2px solid var(--edge);background:var(--surface);padding:8px 12px;box-shadow:2px 2px 0 var(--drop)}
.inbox button:hover{background:var(--surface2)}
.inbox canvas{grid-area:p;width:28px;height:28px;image-rendering:pixelated}
.ib-from{grid-area:f;font-weight:600;font-size:14px;line-height:1.2}.ib-from small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.ib-title{grid-area:t;font-weight:600}.ib-title em{font-style:normal;color:var(--muted);font-weight:400;font-size:13px}
.inbox .tag{grid-area:g;justify-self:end}
.ib-due{grid-area:d;justify-self:start;font:8px/1.9 var(--pixel);padding:1px 6px;background:var(--surface2)}
.ib-rw{grid-area:r;font-size:13px;color:var(--money);font-weight:600;justify-self:end}
.tag{font:8px/1.9 var(--pixel);padding:1px 6px;border:1px solid var(--edge)}
.t-sql{background:#d8e4ff;color:#1c3a8a}.t-py{background:#fff1c2;color:#6b4b00}.t-fill{background:#dff3e6;color:#1d5c37}.t-quiz{background:#f6dcea;color:#7a1f4f}
.back{border:0;background:none;color:var(--blue);font-weight:600;padding:0;margin-bottom:10px}
.mail-h{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;border-bottom:2px solid var(--edge);padding-bottom:12px}
.mail-h canvas{width:44px;height:44px;image-rendering:pixelated;background:var(--surface2);border:2px solid var(--edge)}
.mail-from{font-size:13px;font-weight:600}.mail-from span{color:var(--muted);font-weight:400}
.mail-h h3{margin:2px 0 6px;font-size:20px;line-height:1.25}
.mail-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
.brief{font-size:16px;max-width:70ch;margin:14px 0}
.ed-head{display:flex;justify-content:space-between;font-size:12px;background:var(--code);color:var(--code-mute);padding:6px 10px;border:2px solid var(--edge);border-bottom:0}
.ed-head span:first-child{color:var(--hi);font-family:var(--pixel);font-size:9px;line-height:1.9}
.code{display:block;width:100%;margin:0;background:var(--code);color:var(--code-ink);border:2px solid var(--edge);font:14px/1.6 var(--mono);padding:12px;tab-size:4}
textarea.code{min-height:150px;resize:vertical}
pre.fill{white-space:pre-wrap;word-break:break-word}
.blank{font:inherit;background:#22305c;color:var(--hi);border:0;border-bottom:2px solid var(--hi);padding:0 4px;margin:0 2px;text-transform:none}
.tbls{margin-top:8px;font-size:13px}.tbls summary{cursor:pointer;color:var(--blue);font-weight:600}
.tb{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{border:1px solid var(--edge);background:var(--surface2);font:12px var(--mono);padding:1px 6px}.chip.tname{background:var(--hi);color:var(--hi-ink);font-weight:600}
.ed-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}.ed-actions .sp{flex:1}
.hint{margin-top:10px;padding:10px 12px;border-left:4px solid var(--hi);background:var(--surface2);font-size:14px}
.out{margin-top:12px}
.out-label{font:9px/1.9 var(--pixel);color:var(--muted);margin-bottom:4px}
.err{background:color-mix(in srgb,var(--alert) 14%,var(--surface));border:2px solid var(--alert);padding:10px 12px;font-size:14px;margin-bottom:10px;white-space:pre-wrap}
.val{font:16px var(--mono);padding:8px 12px;background:var(--surface2);border:2px solid var(--edge);display:inline-block;margin-bottom:6px}
.tbl-wrap{overflow-x:auto;border:2px solid var(--edge);max-height:320px;overflow-y:auto}
table.res{border-collapse:collapse;font:13px var(--mono);width:max-content;min-width:100%}
table.res th{position:sticky;top:0;background:var(--surface2);text-align:left;padding:5px 10px;border-bottom:2px solid var(--edge);font-weight:600}
table.res td{padding:4px 10px;border-bottom:1px solid color-mix(in srgb,var(--edge) 25%,transparent);white-space:nowrap}
table.res .ix{color:var(--muted);font-weight:600}
.nan{color:var(--muted);font-style:italic}
.quiz{display:flex;flex-direction:column;gap:8px;max-width:640px}
.opt{text-align:left;border:2px solid var(--edge);background:var(--surface);padding:10px 14px;font-size:15px;box-shadow:2px 2px 0 var(--drop)}
.opt:hover:not(:disabled){background:var(--surface2)}.opt.no{text-decoration:line-through;opacity:.55}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px solid var(--edge);padding:10px 12px;background:var(--surface2)}.confirm p{margin:0;flex:1 1 260px}
.done{display:grid;grid-template-columns:56px 1fr;gap:12px 14px;align-items:center;max-width:680px}
.done canvas{width:56px;height:56px;image-rendering:pixelated;background:var(--surface2);border:2px solid var(--edge)}
.done-q{font-size:20px;font-weight:600;margin:0;line-height:1.3}.done-who{margin:2px 0 0;color:var(--muted);font-size:13px}
.done-rw{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font:11px/1.8 var(--pixel)}
.done-rw .money{background:var(--money);color:#fff;padding:4px 8px}.done-rw .fast{background:var(--hi);color:var(--hi-ink);padding:4px 8px}
.insight{grid-column:1/-1;border:2px solid var(--edge);background:var(--surface2);padding:12px 16px;box-shadow:3px 3px 0 var(--drop)}
.insight h4{margin:0 0 6px;font-size:14px;color:var(--blue)}.insight p{margin:0;font-size:15px;max-width:68ch}
.done .btn{grid-column:1/-1;justify-self:start}
.empty-state{padding:40px 10px;max-width:46ch}.empty-state p:first-child{font-size:18px;font-weight:600;margin:0 0 6px}
.dict{border-bottom:2px dashed var(--edge);padding:12px 0}.dict h4{margin:0;font:11px/1.8 var(--pixel)}.dict h4 span{font:13px var(--sans)}
.dict p{margin:4px 0 8px}.dict dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 16px;margin:0 0 8px}
.dict dl div{display:flex;gap:8px;font-size:13px}.dict dt{font-family:var(--mono);font-weight:600}.dict dd{margin:0;color:var(--muted)}
.dict summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:13px;margin-bottom:6px}
table.ledger{border-collapse:collapse;width:100%;font-size:14px}
table.ledger td{padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--edge) 25%,transparent)}
table.ledger td.num{text-align:right;font-family:var(--mono);white-space:nowrap}
table.ledger tr.bad td{color:var(--alert)}table.ledger tr.good td{color:var(--money)}
table.ledger tr.total td{font-weight:700;border-top:2px solid var(--edge);border-bottom:0;font-size:16px}
table.hist small{display:block;color:var(--muted)}
.sum-lead{font-size:18px;font-weight:600;margin-top:0}.warn{background:var(--hi);color:var(--hi-ink);padding:8px 12px;font-weight:600}
/* LOJA */
.shop-nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.shop-nav button{border:2px solid var(--edge);background:var(--surface2);padding:6px 10px;font-weight:600;font-size:14px}
.shop-nav button.on{background:var(--hi);color:var(--hi-ink);box-shadow:2px 2px 0 var(--drop)}
.shop-money{margin-left:auto;font:11px var(--pixel);color:var(--money)}
.shop-list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:2px solid var(--edge);padding:10px 12px;background:var(--surface)}
.item:not(:has(canvas)){grid-template-columns:1fr auto}
.item canvas{width:44px;height:44px;image-rendering:pixelated;background:var(--surface2)}
.item b{font-size:15px}.item p{margin:2px 0 0;font-size:13px;color:var(--muted)}.item .req{color:var(--alert)}
/* CARREIRA */
.career{display:grid;grid-template-columns:240px 1fr;gap:20px}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:6px;align-self:start}
.ladder li{border:2px solid var(--edge);padding:8px 10px;display:flex;flex-direction:column;background:var(--surface2);opacity:.6}
.ladder li span{font-size:12px;color:var(--muted)}
.ladder li.past{opacity:.85}.ladder li.now{opacity:1;background:var(--hi);color:var(--hi-ink);box-shadow:3px 3px 0 var(--drop)}.ladder li.now span{color:var(--hi-ink)}
.career h4{margin:0 0 8px;font-size:15px}.career h4:not(:first-child){margin-top:18px}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.reqs li{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.reqs li .bar{height:10px;grid-column:auto}.reqs li.ok .bar i{background:var(--money)}.reqs .num{text-align:right;font-family:var(--mono);font-size:13px}
/* AJUDA */
.help dl{display:grid;gap:6px;margin:12px 0}.help dl div{display:grid;grid-template-columns:110px 1fr;gap:10px}.help dt{font-weight:700}.help dd{margin:0}
/* INÍCIO */
.start-hero h1{font:clamp(16px,3.4vw,26px)/1.5 var(--pixel);margin:0 0 10px;color:var(--blue)}
.start-hero p{font-size:16px;max-width:60ch;margin:0 0 16px}
.cont{border:2px solid var(--edge);background:var(--surface2);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.cont p{margin:0;flex:1 1 240px}
.start h4{margin:8px 0}
.creator{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
#stPrev{width:112px;height:168px;image-rendering:pixelated;background:var(--surface2);border:2px solid var(--edge)}
.cr-f{display:flex;flex-direction:column;gap:6px}
.cr-f label,.cr-f .lbl{font-size:13px;font-weight:600;margin-top:4px}
#stNome{font:16px var(--sans);padding:8px 10px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);max-width:320px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:30px;height:30px;border:2px solid var(--edge)}.sw button.on{outline:3px solid var(--hi);outline-offset:1px}
.seg{display:flex;gap:0;margin-top:8px}.seg button{border:2px solid var(--edge);background:var(--surface2);padding:6px 12px;margin-right:-2px;font-size:14px}.seg button.on{background:var(--blue);color:#fff}
/* TOAST */

    if(['==','!=','>=','<=','**','//'].includes(two)){toks.push({t:'op',v:two});i+=2;continue;}
    if('([{'.includes(c)){depth++;toks.push({t:'op',v:c});i++;continue;}
    if(')]}'.includes(c)){depth=Math.max(0,depth-1);toks.push({t:'op',v:c});i++;continue;}

  round:a=>{const d=a[1]||0;if(a[0] instanceof Series)return callBound(new Bound(a[0],'round'),[d],{});if(isNull(a[0]))return a[0];return Math.round(a[0]*10**d)/10**d;},
  sum:a=>toList(a[0]).reduce((x,y)=>x+y,0),
  max:a=>{const l=a.length>1?a:toList(a[0]);return l.reduce((x,y)=>cmpVals(x,y)>=0?x:y);},
  min:a=>{const l=a.length>1?a:toList(a[0]);return l.reduce((x,y)=>cmpVals(x,y)<=0?x:y);},
  abs:a=>Math.abs(a[0]),int:a=>Math.trunc(Number(a[0])),float:a=>Number(a[0]),str:a=>fmtScalar(a[0]),
  list:a=>a[0] instanceof Series?a[0].values.slice():toList(a[0]).slice(),
  sorted:a=>[...toList(a[0])].sort(cmpVals),
  type:a=>`<class '${typeName(a[0])}'>`
};
function fmtScalar(v){if(v===null||v===undefined)return'None';if(v===true)return'True';if(v===false)return'False';if(typeof v==='number'){if(!isFinite(v))return v>0?'inf':'nan';return Number.isInteger(v)?String(v):String(Math.round(v*10000)/10000);}if(Array.isArray(v))return'['+v.map(x=>typeof x==='string'?`'${x}'`:fmtScalar(x)).join(', ')+']';if(v instanceof Tuple)return'('+v.items.map(fmtScalar).join(', ')+')';return String(v);}
function evalNode(n,env,ctx){
  switch(n.k){
    case 'lit':return n.v;
    case 'name':if(Object.prototype.hasOwnProperty.call(env,n.v))return env[n.v];if(BUILTINS[n.v]||n.v==='print')return{builtin:n.v};throw perr(`NameError: “${n.v}” não foi definido. Tabelas disponíveis: vendas, clientes, campanhas, entregas.`);
    case 'list':return n.items.map(x=>evalNode(x,env,ctx));
    case 'tuple':return new Tuple(n.items.map(x=>evalNode(x,env,ctx)));
    case 'dict':return new PyDict(n.pairs.map(([k,v])=>[evalNode(k,env,ctx),evalNode(v,env,ctx)]));
    case 'bool':{const a=evalNode(n.a,env,ctx);if(a instanceof Series)throw perr('Com Series use & (e) e | (ou), com parênteses em cada condição, em vez de and/or.');if(n.op==='and')return a?evalNode(n.b,env,ctx):a;return a?a:evalNode(n.b,env,ctx);}
    case 'bin':return binop(n.op,evalNode(n.a,env,ctx),evalNode(n.b,env,ctx));
    case 'un':{const a=evalNode(n.a,env,ctx);if(n.op==='-')return elementwise(a,0,v=>isNull(v)?v:-v);if(n.op==='+')return a;if(n.op==='~'){if(a instanceof Series)return elementwise(a,0,v=>!v);return ~a;}if(n.op==='not'){if(a instanceof Series)throw perr('Para negar um filtro use ~ (til).');return !a;}}
    case 'idx':return getItem(evalNode(n.obj,env,ctx),evalNode(n.key,env,ctx));
    case 'slice':{const o=evalNode(n.obj,env,ctx);const s=n.s?evalNode(n.s,env,ctx):0;const e=n.e?evalNode(n.e,env,ctx):undefined;if(o instanceof DF)return new DF(o.cols.slice(),o.rows.slice(s,e),o.index.slice(s,e));if(o instanceof Series)return new Series(o.name,o.index.slice(s,e),o.values.slice(s,e),o.indexName,o.isDefault);if(Array.isArray(o)||typeof o==='string')return o.slice(s,e);throw perr('Fatiamento não suportado aqui.');}
    case 'attr':return getAttr(evalNode(n.obj,env,ctx),n.name);
    case 'call':{const f=evalNode(n.fn,env,ctx);const args=n.args.map(x=>evalNode(x,env,ctx));const kwargs={};for(const k in n.kwargs)kwargs[k]=evalNode(n.kwargs[k],env,ctx);
      if(f instanceof Bound)return callBound(f,args,kwargs,ctx);
      if(f&&f.builtin==='print'){ctx.out.push(args.length===1?args[0]:args.map(fmtScalar).join(' '));ctx.lastPrint=args.length===1?args[0]:undefined;return null;}
      if(f&&f.builtin)return BUILTINS[f.builtin](args,kwargs);
      throw perr(`TypeError: ${typeName(f)} não é uma função.`);}
  }
  throw perr('Expressão não suportada.');
}
function cloneTables(){const env={pd:PD};for(const t in DATA){const rows=DATA[t].map(r=>({...r}));env[t]=new DF(Object.keys(DATA[t][0]),rows);}return env;}
function runPython(code){
  const env=cloneTables();const ctx={out:[],lastPrint:undefined};
  const stmts=parse(code);let last;let hasValue=false;
  for(const s of stmts){
    if(s.k==='assign'){
      const v=evalNode(s.value,env,ctx);
      if(s.target.k==='name')env[s.target.v]=v;
      else if(s.target.k==='idx'){const o=evalNode(s.target.obj,env,ctx);const key=evalNode(s.target.key,env,ctx);
        if(o instanceof DF&&typeof key==='string'){const vals=v instanceof Series?v.values:o.rows.map(()=>v);if(vals.length!==o.rows.length)throw perr('A nova coluna precisa ter o mesmo tamanho da tabela.');o.rows=o.rows.map((r,i)=>({...r,[key]:vals[i]}));if(!o.cols.includes(key))o.cols.push(key);}
        else throw perr('Só dá para atribuir colunas assim: df["nova"] = ...');}
      else throw perr('Atribuição não suportada.');
      last=undefined;hasValue=false;
    }else{last=evalNode(s.e,env,ctx);hasValue=!(s.e.k==='call'&&s.e.fn.k==='name'&&s.e.fn.v==='print');}
  }
  let result=hasValue?last:ctx.lastPrint;
  return {result,prints:ctx.out,hasResult:result!==undefined};
}

/* ============ SQL (alasql) ============ */
let SQLDB=null;
function sqlDb(){if(SQLDB)return SQLDB;const db=new alasql.Database();for(const t in DATA){db.exec(`CREATE TABLE ${t}`);db.tables[t].data=DATA[t].map(r=>({...r}));}SQLDB=db;return db;}
function runSQL(code){
  let q=code.replace(/--[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'').trim().replace(/;+\s*$/,'');
  if(!q)throw new Error('Escreva uma consulta.');
  if(q.includes(';'))throw new Error('Envie uma consulta por vez (sem ; no meio).');
  if(!/^(select|with)\b/i.test(q)){
    if(/^(delete|drop|update|insert|truncate|alter)\b/i.test(q))throw new Error('Opa! Essa base é de produção. Aqui só rodamos SELECT. (O Kevin manda lembranças.)');
    throw new Error('A consulta precisa começar com SELECT.');}
  q=q.split(/('(?:[^']|'')*')/).map((part,i)=>i%2?part:part.replace(/\bAS\s+(count|sum|top|desc|asc|order|group|avg|min|max)\b/gi,'AS `$1`').replace(/(^|[^`\w.])(total|value|index)\b(?!\s*\()/gi,'$1`$2`')).join('');
  const db=sqlDb();
  for(const t in DATA)db.tables[t].data=DATA[t].map(r=>({...r}));
  let res;
  try{res=db.exec(q);}catch(e){throw new Error(traduzErroSQL(e.message||String(e)));}
  if(!Array.isArray(res))throw new Error('A consulta não retornou linhas.');
  const cols=res.length?Object.keys(res[0]):[];
  return new DF(cols,res.map(r=>{const o={};cols.forEach(c=>o[c]=r[c]===undefined?null:r[c]);return o;}));
}
function traduzErroSQL(m){
  if(/Table .* does not exist|Table does not exist/i.test(m))return 'Tabela não encontrada. As tabelas são: vendas, clientes, campanhas, entregas.';
  if(/Parse error/i.test(m))return 'Erro de sintaxe no SQL. Confira vírgulas, aspas simples nos textos e a ordem SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT.';
  if(/Column .* not found|Cannot read/i.test(m))return 'Alguma coluna não existe ou está escrita errado. Confira o dicionário de dados.';
  return 'Erro no SQL: '+m;
}

/* ============ VERIFICADOR ============ */
function normalize(v){
  if(v instanceof DF)return v.rows.map(r=>v.cols.map(c=>r[c]));
  if(v instanceof Series)return v.isDefault?v.values.map(x=>[x]):v.index.map((k,i)=>[k,v.values[i]]);
  if(Array.isArray(v))return v.map(x=>[x]);
  if(v instanceof Tuple)return [v.items];
  return [[v]];
}
function cellKey(c){if(isNull(c))return'∅';if(typeof c==='boolean')return c?'1':'0';if(typeof c==='number')return'#';return'$'+String(c).trim().toLowerCase();}
function rowSig(row){const s=row.map(cellKey).filter(k=>k[0]==='$').sort();return s.join('|');}
function sameRow(a,b){
  if(a.length!==b.length)return false;
  const sa=a.filter(c=>typeof c==='string').map(x=>x.trim().toLowerCase()).sort(),sb=b.filter(c=>typeof c==='string').map(x=>x.trim().toLowerCase()).sort();
  if(sa.join('|')!==sb.join('|'))return false;
  const toN=c=>isNull(c)?null:typeof c==='boolean'?(c?1:0):c;
  const na=a.filter(c=>typeof c!=='string').map(toN),nb=b.filter(c=>typeof c!=='string').map(toN);
  const sortN=x=>x.slice().sort((p,q)=>p===null?1:q===null?-1:p-q);
  const xa=sortN(na),xb=sortN(nb);
  return xa.every((x,i)=>{const y=xb[i];if(x===null||y===null)return x===y;return Math.abs(x-y)<=Math.max(0.051,Math.abs(y)*0.0006);});
}
function compareResults(got,exp,ordered){
  const A=normalize(got),B=normalize(exp);
  if(A.length!==B.length)return {ok:false,msg:`Seu resultado tem ${A.length} linha(s); o esperado tem ${B.length}.`};
  if(A[0]&&B[0]&&A[0].length!==B[0].length)return {ok:false,msg:`Seu resultado tem ${A[0].length} coluna(s); o esperado tem ${B[0].length}. Retorne só o que foi pedido.`};
  if(ordered){for(let i=0;i<A.length;i++)if(!sameRow(A[i],B[i]))return {ok:false,msg:i===0&&A.length>1?'Os valores ou a ordem não batem. Confira o critério de ordenação.':`A linha ${i+1} não bate com o esperado.`};return{ok:true};}
  const used=new Array(B.length).fill(false);
  for(const r of A){const j=B.findIndex((b,k)=>!used[k]&&sameRow(r,b));if(j<0)return {ok:false,msg:'Os valores não batem com o esperado. Confira filtros e agregações.'};used[j]=true;}
  return {ok:true};
}
function runCode(lang,code){if(lang==='sql')return {result:runSQL(code),prints:[],hasResult:true};return runPython(code);}

  insight:'SQL busca, pandas transforma, DAX mede no dashboard. Saber qual ferramenta usar em cada etapa é o que diferencia um analista sênior.'},
 // ---------- PLENO ----------
 {id:'s4',tier:2,from:'carlao',kind:'sql',title:'Ticket médio por canal',
  brief:'Qual canal traz pedidos maiores? Quero o ticket médio (média de valor) por canal.',
  starter:'',solution:'SELECT canal, AVG(valor) FROM vendas GROUP BY canal;',hint:'AVG(valor) agrupado por canal.',
  insight:'Canais com ticket maior merecem ofertas de produtos premium. Canais com ticket menor podem receber kits e combos para subir o valor.'},
 {id:'s5',tier:2,from:'jorge',kind:'sql',title:'Clube dos 40 mil',
  brief:'Quais vendedores venderam mais de R$ 40.000 no total? Quero vendedor e total.',
  starter:'',solution:'SELECT vendedor, SUM(valor) FROM vendas GROUP BY vendedor HAVING SUM(valor) > 40000;',hint:'GROUP BY vendedor e HAVING SUM(valor) > 40000.',
  insight:'Esses vendedores batem a meta de bônus. Entender o que fazem diferente (carteira, produto, canal) vale mais que o próprio bônus.'},
 {id:'s6',tier:2,from:'bia',kind:'sql',title:'Quem é nosso cliente?',
  brief:'Faturamento por segmento de cliente (Varejo, Atacado, Corporativo). Os dados de segmento estão na tabela clientes.',
  starter:'',solution:'SELECT c.segmento, SUM(v.valor) FROM vendas v JOIN clientes c ON v.cliente_id = c.id GROUP BY c.segmento;',hint:'JOIN clientes c ON v.cliente_id = c.id, depois GROUP BY c.segmento.',
  insight:'Varejo lidera a receita. A comunicação de marketing deve falar a língua do pequeno lojista, não do comprador corporativo.'},
 {id:'s7',tier:2,from:'neide',kind:'sql',title:'Unidades por categoria',
  brief:'Pra planejar o estoque: quantas unidades (quantidade) saíram de cada categoria?',
  starter:'',solution:'SELECT categoria, SUM(quantidade) FROM vendas GROUP BY categoria;',hint:'SUM(quantidade) por categoria.',
  insight:'Acessórios saem em volume, eletrônicos em valor. Estoque e armazém são planejados por unidade; o caixa, por valor.'},
 {id:'p4',tier:2,from:'bia',kind:'py',title:'ROI de verdade',
  brief:'Crie a coluna roi = (receita − investimento) ÷ investimento e me devolva o ROI médio por canal, do maior para o menor.',
  starter:"campanhas['roi'] = \n",solution:"campanhas['roi'] = (campanhas['receita'] - campanhas['investimento']) / campanhas['investimento']\ncampanhas.groupby('canal')['roi'].mean().sort_values(ascending=False)",ordered:true,hint:"Depois de criar a coluna: groupby('canal')['roi'].mean().sort_values(ascending=False)",
  insight:'YouTube tem o melhor retorno por real investido, mesmo sem ser o canal com mais receita. Realocar verba para ele tende a aumentar o lucro total.'},
 {id:'p5',tier:2,from:'neide',kind:'py',title:'Atrasos por transportadora',
  brief:'Quantas entregas ATRASADAS cada transportadora teve?',
  starter:'',solution:"entregas[entregas['situacao'] == 'Atrasado']['transportadora'].value_counts()",hint:'Filtre situacao == "Atrasado" e depois value_counts() na transportadora.',
  insight:'Em números absolutos a VaiVoando atrasa mais, mas ela também entrega mais. Sempre olhe proporção, não só contagem.'},
 {id:'p6',tier:2,from:'fabio',kind:'py',title:'Dados faltando',
  brief:'Alguém disse que tem buraco na tabela de entregas. Conte os valores vazios de cada coluna.',
  starter:'',solution:'entregas.isnull().sum()',hint:'isnull() marca vazios; sum() conta por coluna.',
  insight:'Vazio em dias_reais significa “em trânsito”, não erro. Entender por que um dado falta é tão importante quanto contá-lo.'},
 {id:'q8',tier:2,from:'chefe',kind:'quiz',title:'Corte de verba',
  brief:'Precisamos cortar 20% da verba de marketing. Qual critério você usaria para escolher o que cortar?',
  options:['Cortar os canais com menor ROI e menor potencial de escala','Cortar igualmente todos os canais','Cortar o canal com menor receita absoluta','Cortar o canal que o diretor não gosta'],answer:0,
  insight:'Corte linear é confortável politicamente e ruim financeiramente. Decisão de verba é sobre retorno marginal: onde o próximo real rende menos.'},
 {id:'q9',tier:2,from:'kevin',kind:'quiz',title:'Kevin aprendendo R',
  brief:'O Kevin entrou num curso de R. Qual pacote faz em R o papel que o pandas faz em Python?',
  options:['dplyr (tidyverse)','ggplot2','shiny','knitr'],answer:0,
  insight:'dplyr filtra, agrupa e resume, como pandas. ggplot2 é para gráficos. Os conceitos se transferem entre linguagens; a sintaxe é detalhe.'},
 // ---------- SÊNIOR ----------
 {id:'s8',tier:3,from:'bia',kind:'sql',title:'Taxa de conversão por canal',
  brief:'Taxa de conversão (%) por canal = soma de conversões × 100 ÷ soma de cliques. Ordene da maior para a menor.',
  starter:'',solution:'SELECT canal, SUM(conversoes) * 100.0 / SUM(cliques) AS taxa FROM campanhas GROUP BY canal ORDER BY taxa DESC;',ordered:true,hint:'Use SUM(conversoes) * 100.0 / SUM(cliques). O 100.0 evita divisão inteira em bancos reais.',
  insight:'Somar antes de dividir dá a taxa ponderada. Fazer média das taxas mensais distorce quando os volumes são diferentes. E-mail converte pouco: talvez a lista esteja velha.'},
 {id:'s9',tier:3,from:'carlao',kind:'sql',title:'Faixas de pedido',
  brief:'Classifique os pedidos em faixas: “Alto” (valor ≥ 3000), “Médio” (≥ 1000) e “Baixo” (o resto). Quero faixa e quantidade de pedidos.',
  starter:'',solution:"SELECT CASE WHEN valor >= 3000 THEN 'Alto' WHEN valor >= 1000 THEN 'Médio' ELSE 'Baixo' END AS faixa, COUNT(*) FROM vendas GROUP BY CASE WHEN valor >= 3000 THEN 'Alto' WHEN valor >= 1000 THEN 'Médio' ELSE 'Baixo' END;",hint:"CASE WHEN ... THEN 'Alto' ... END, e agrupe pela mesma expressão.",
  insight:'Segmentar pedidos por faixa permite políticas diferentes: frete grátis no Médio para empurrar para o Alto, atendimento consultivo no Alto.'},
 {id:'s10',tier:3,from:'carlao',kind:'sql',title:'Clientes fantasmas',
  brief:'Quais clientes ATIVOS nunca compraram nada? Quero só o nome deles. Vou ligar um por um.',
  starter:'',solution:'SELECT c.nome FROM clientes c LEFT JOIN vendas v ON v.cliente_id = c.id WHERE c.ativo = 1 AND v.id IS NULL;',hint:'LEFT JOIN de clientes com vendas e filtre v.id IS NULL. Ou use NOT IN.',
  insight:'Cliente ativo sem compra é receita parada. Uma ação de reativação nessa lista costuma ter custo baixíssimo e retorno rápido.'},
 {id:'s11',tier:3,from:'jorge',kind:'sql',title:'Acima da média',
  brief:'Quantos pedidos ficaram acima do ticket médio geral? Use uma subconsulta.',
  starter:'',solution:'SELECT COUNT(*) FROM vendas WHERE valor > (SELECT AVG(valor) FROM vendas);',hint:'WHERE valor > (SELECT AVG(valor) FROM vendas)',
  insight:'Menos da metade dos pedidos fica acima da média: os pedidos grandes puxam a média para cima, típico de B2B. Planeje com mediana, projete receita com média.'},
 {id:'p7',tier:3,from:'jorge',kind:'py',title:'Faturamento por estado',
  brief:'Junte vendas com clientes e me dê o faturamento por estado. Em vendas a chave é cliente_id; em clientes, id.',
  starter:'',solution:"pd.merge(vendas, clientes, left_on='cliente_id', right_on='id').groupby('estado')['valor'].sum()",hint:"pd.merge(vendas, clientes, left_on='cliente_id', right_on='id'), depois groupby('estado').",
  insight:'Estado define imposto (ICMS) e frete. Um estado com muita venda e frete caro pode estar dando prejuízo escondido.'},
 {id:'p8',tier:3,from:'carlao',kind:'py',title:'Matriz região × canal',
  brief:'Monte uma tabela dinâmica: regiões nas linhas, canais nas colunas, soma de valor. Onde não tiver venda, coloque 0.',
  starter:'',solution:"pd.pivot_table(vendas, index='regiao', columns='canal', values='valor', aggfunc='sum', fill_value=0)",hint:"pd.pivot_table(vendas, index=..., columns=..., values=..., aggfunc='sum', fill_value=0)",
  insight:'Os zeros contam a história: o App só vende no Sudeste e no Sul, e o Norte compra apenas pelo Site. Ou falta divulgação do app, ou falta presença física nessas regiões.'},
 {id:'p9',tier:3,from:'carlao',kind:'py',title:'Top 3 produtos',
  brief:'Quais os 3 produtos com maior faturamento? Do maior para o menor.',
  starter:'',solution:"vendas.groupby('produto')['valor'].sum().sort_values(ascending=False).head(3)",ordered:true,hint:'groupby, sum, sort_values(ascending=False), head(3).',
  insight:'O Notebook sozinho faz mais da metade da receita. Dependência de um produto é risco: uma falta de estoque derruba o mês.'},
 {id:'q10',tier:3,from:'chefe',kind:'quiz',title:'Black Friday',
  brief:'O comercial quer 40% de desconto em tudo na Black Friday. O que você checa antes de apoiar?',
  options:['Margem por produto e elasticidade: se o volume extra cobre o desconto','Se os concorrentes também vão dar 40%','Se o site aguenta','Nada, desconto sempre aumenta o lucro'],answer:0,
  insight:'Desconto aumenta receita fácil e lucro difícil. Com margem de 30%, um desconto de 40% vende abaixo do custo: quanto mais vende, mais perde.'},
 {id:'q11',tier:3,from:'bia',kind:'quiz',title:'Teste A/B',
  brief:'A nova página teve conversão 3,2% contra 3,0% da antiga, com p-valor de 0,30. O que recomendar?',
  options:['Ainda não há evidência de diferença; continuar o teste ou aceitar empate','Trocar já, ganhou!','Voltar para a antiga','Refazer com cores diferentes'],answer:0,
  insight:'p-valor alto indica que a diferença pode ser acaso. Decidir com ruído gera “vitórias” que somem no mês seguinte.'},
 // ---------- COORDENAÇÃO ----------
 {id:'s12',tier:4,from:'chefe',kind:'sql',title:'Curva do semestre',
  brief:'Faturamento por mês, em ordem de mês, para a apresentação da diretoria.',
  starter:'',solution:'SELECT mes, SUM(valor) FROM vendas GROUP BY mes ORDER BY mes;',ordered:true,hint:'GROUP BY mes ORDER BY mes.',
  insight:'Queda forte em maio e junho. Antes de culpar o mercado, cruze com campanhas e estoque: talvez o problema seja interno.'},
 {id:'s13',tier:4,from:'chefe',kind:'sql',title:'Churn da base',
  brief:'Qual o percentual de clientes inativos (ativo = 0) sobre o total? Um número.',
  starter:'',solution:'SELECT 100.0 * SUM(CASE WHEN ativo = 0 THEN 1 ELSE 0 END) / COUNT(*) FROM clientes;',hint:'SUM(CASE WHEN ativo = 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*)',
  insight:'Churn de 20% significa repor um em cada cinco clientes só para ficar no lugar. Reter costuma custar muito menos que adquirir.'},
 {id:'s14',tier:4,from:'neide',kind:'sql',title:'Quem mais estoura prazo',
  brief:'Atraso médio em dias (dias_reais − prazo_dias) por transportadora, ignorando as em trânsito. Do pior para o melhor.',
  starter:'',solution:'SELECT transportadora, AVG(dias_reais - prazo_dias) AS atraso FROM entregas WHERE dias_reais IS NOT NULL GROUP BY transportadora ORDER BY atraso DESC;',ordered:true,hint:'WHERE dias_reais IS NOT NULL, AVG(dias_reais - prazo_dias), ORDER BY ... DESC.',
  insight:'A TartaLog atrasa mais de 2 dias em média. Com esse dado a Neide renegocia contrato com multa por atraso, ou troca de fornecedor.'},
 {id:'p10',tier:4,from:'jorge',kind:'py',title:'Participação por região',
  brief:'Participação (%) de cada região no faturamento total, arredondada para 1 casa decimal.',
  starter:'',solution:"(vendas.groupby('regiao')['valor'].sum() / vendas['valor'].sum() * 100).round(1)",hint:'Divida o groupby pela soma total, multiplique por 100 e use .round(1).',
  insight:'Quase 60% no Sudeste. Expandir para o Sul, que já responde por 21%, é mais barato que abrir o Norte do zero.'},
 {id:'p11',tier:4,from:'bia',kind:'py',title:'Safras de clientes',
  brief:'Quantos clientes entraram em cada mês (mes_cadastro)? É o começo da nossa análise de coorte.',
  starter:'',solution:"clientes.groupby('mes_cadastro')['id'].count()",hint:"groupby('mes_cadastro')['id'].count()",
  insight:'Coorte agrupa clientes pelo mês de entrada. Depois você acompanha quantos de cada safra seguem ativos: é assim que se mede retenção de verdade.'},
 {id:'p12',tier:4,from:'chefe',kind:'py',title:'Ranking comercial',
  brief:'Por vendedor: total vendido (coluna total) e número de pedidos (coluna pedidos), ordenado pelo total, do maior para o menor.',
  starter:'',solution:"vendas.groupby('vendedor').agg(total=('valor', 'sum'), pedidos=('id', 'count')).sort_values('total', ascending=False)",ordered:true,hint:"agg(total=('valor','sum'), pedidos=('id','count')) e sort_values('total', ascending=False).",
  insight:'A Carla vende mais com pedidos parecidos com os da Ana: ticket maior. Treinar o time no discurso dela vale mais que contratar.'},
 {id:'q12',tier:4,from:'chefe',kind:'quiz',title:'IA em tudo',
  brief:'A diretoria quer “uma IA que preveja churn” para semana que vem. Os dados de cancelamento estão espalhados em três planilhas. Primeiro passo?',
  options:['Definir churn com o negócio e consolidar um histórico confiável','Contratar uma ferramenta de IA','Treinar um modelo com o que tiver','Dizer que é impossível'],answer:0,
  insight:'Modelo bom com dado ruim é chute caro. Na maioria dos projetos, 80% do valor está em definir o problema e organizar os dados.'},
 {id:'q13',tier:4,from:'chefe',kind:'quiz',title:'Apresentando para a diretoria',
  brief:'Você tem 5 minutos com o CEO. Como abre a apresentação?',
  options:['Com a recomendação e o impacto em R$; detalhes depois, se pedirem','Com a metodologia completa','Com todos os gráficos que você fez','Com uma piada sobre SQL'],answer:0,
  insight:'Executivos decidem por conclusão, não por processo. Comece pelo “e daí?”; a metodologia é seu respaldo, não seu roteiro.'}

function blocked(x,y,who){
  if(x<0||y<0||x>=MW||y>=MH)return true;

function alvo(){

function stepChar(ch,dt,speed){
  if(!ch.moving)return;
  ch.anim=(ch.anim||0)+dt;
  const tx=ch.tx*T,ty=ch.ty*T;const v=speed*T*dt;
  const dx=tx-ch.px,dy=ty-ch.py;const dist=Math.hypot(dx,dy);
  if(dist<=v){ch.px=tx;ch.py=ty;ch.x=ch.tx;ch.y=ch.ty;ch.tx=undefined;ch.ty=undefined;ch.moving=false;}
  else{ch.px+=dx/dist*v;ch.py+=dy/dist*v;}
}

function update(dt){

const PAY=[90,160,280,450,700,900],XPT=[30,45,70,100,140,160];
function getM(e){
  if(e.ref.startsWith('rec:')){const [,k,vi]=e.ref.split(':');const r=RECORRENTES[k];const v=r.variants[+vi];
    return {id:e.ref,rec:k,tier:Math.min(S.cargo,3),from:r.from,kind:r.lang,lang:r.lang,title:r.nome,brief:v.brief,solution:v.solution,starter:'',hint:r.lang==='sql'?'Uma consulta simples com SUM, COUNT ou WHERE resolve.':'Selecione a coluna e use sum() ou mean().',
      insight:'Tarefa repetitiva é candidata a automação. Depois de 3 entregas e com Python suficiente, compre a automação na loja e nunca mais faça este relatório na mão.'};}
  if(e.ref.startsWith('evt:')){const k=e.ref.slice(4);return {id:e.ref,evt:k,tier:Math.min(S.cargo,3),...MISSOES_EVENTO[k],starter:''};}
  return MISSOES.find(m=>m.id===e.ref);
}
function rewardOf(m,e){
  let pay=m.rec?70+30*S.cargo:PAY[m.tier];let xp=m.rec?20:XPT[m.tier];
  if(m.evt)pay*=2;
  if(e&&e.revisao){pay*=.5;xp*=.5;}
  const ev=eventoHoje();if(ev&&ev.mult)pay*=ev.mult;
  if(has('quadro'))pay*=1.05;if(has('monitor2'))xp*=1.15;if(S.autos.includes('a_etl'))xp*=1.1;
  return {pay:Math.round(pay),xp:Math.round(xp)};
}
function poolDisponivel(from){
  const ativos=new Set(S.missoes.map(e=>e.ref));
  let p=MISSOES.filter(m=>m.tier<=S.cargo&&!S.feitas[m.id]&&!ativos.has(m.id)&&(!from||m.from===from));
  const novas=p.filter(m=>m.tier>=S.cargo-1);if(novas.length)p=novas;
  if(!p.length){p=MISSOES.filter(m=>m.tier<=S.cargo&&m.tier>=S.cargo-1&&!ativos.has(m.id)&&(!from||m.from===from)).map(m=>({...m,_rev:true}));}
  return p;
}
function addMissao(m,dueExtra){
  const due=S.dia+(dueExtra!=null?dueExtra:(m.kind==='quiz'||m.kind==='fill'?1:2));
  const e={uid:S.uid++,ref:m.id,due,start:S.dia,wrong:0,gab:false,draft:null};if(m._rev)e.revisao=true;
  S.missoes.push(e);return e;
}
function gerarMissoesDoDia(){
  // recorrente
  if(S.cargo>=1){
    const recs=Object.keys(RECORRENTES).filter(k=>!LOJA.automacoes.some(a=>a.rec===k&&S.autos.includes(a.id)));
    const ativos=S.missoes.filter(e=>e.ref.startsWith('rec:')).length;
    if(recs.length&&ativos===0){const k=recs[S.dia%recs.length];const vi=S.dia%RECORRENTES[k].variants.length;S.missoes.push({uid:S.uid++,ref:`rec:${k}:${vi}`,due:S.dia,start:S.dia,wrong:0,gab:false,draft:null});}
  }
  const ev=eventoHoje();
  if(ev&&ev.missao&&!S.missoes.some(e=>e.ref==='evt:'+ev.missao)){S.missoes.push({uid:S.uid++,ref:'evt:'+ev.missao,due:S.dia,start:S.dia,wrong:0,gab:false,draft:null});}
  const regulares=S.missoes.filter(e=>!e.ref.includes(':')).length;
  let novas=Math.max(0,Math.min(2,4-regulares));
  if(S.dia===1)novas=3;
  for(let i=0;i<novas;i++){const p=poolDisponivel();if(!p.length)break;
    const prefer=p.filter(m=>m.tier===S.cargo);const src=prefer.length&&Math.random()<.7?prefer:p;
    addMissao(src[Math.floor(Math.random()*src.length)]);}
}
const expCache=new Map();
function solutionCode(m){if(m.kind==='fill'){let i=0;return m.template.replace(/___/g,()=>m.answers[i++]);}return m.solution;}
function expected(m){const code=solutionCode(m);if(!expCache.has(code))expCache.set(code,runCode(m.lang,code).result);return expCache.get(code);}

function concluir(e,extra){
  const m=getM(e);const rw=rewardOf(m,e);

  const rapido=e.start===S.dia&&!e.revisao;
  if(rapido){pay=Math.round(pay*1.2);}
  const penal=e.gab?.3:Math.max(.4,1-.15*e.wrong);
  pay=Math.round(pay*penal);xp=Math.round(xp*penal);
  S.dinheiro+=pay;S.xp+=xp;
  if(m.kind==='quiz')S.skills.negocio+=xp;else{S.skills[m.lang==='sql'?'sql':'py']+=xp;S.skills.negocio+=Math.round(xp*.25);}
  S.skills.com+=5;

/* ================= DIAS ================= */
function fimDoDia(forcado){
  fecharModal(true);$('#dialog').hidden=true;dlgQueue=[];
  paused=true;
  const horaExtra=S.minuto>=19*60&&!forcado;if(horaExtra)S.chefe=clamp(S.chefe+2,0,100);
  // atrasos
  const venc=S.missoes.filter(e=>e.due<=S.dia);
  venc.forEach(e=>{const m=getM(e);const dept=DEPT_OF[m.from];if(dept)S.rep[dept]=clamp(S.rep[dept]-(m.rec?4:7),0,100);S.chefe=clamp(S.chefe-(m.from==='chefe'?7:4),0,100);S.hoje.atrasos.push(`${m.title} (${NPCS[m.from].nome})`);});
  S.missoes=S.missoes.filter(e=>e.due>S.dia);
  const renda=rendaAutos();
  if(renda){S.dinheiro+=renda;S.autos.forEach(id=>{const a=LOJA.automacoes.find(x=>x.id===id);if(a.dept)S.rep[a.dept]=clamp(S.rep[a.dept]+1,0,100);});}
  let pag=null;
  if(S.dia%4===0){const contas=Math.round(S.salario*.55/10)*10;S.dinheiro+=S.salario-contas;pag={sal:S.salario,contas};}
  let decimo=null;const ev=eventoHoje();if(ev&&ev.bonus&&ev.bonus.decimo){S.dinheiro+=S.salario;decimo=S.salario;}
  const h=S.hoje;
  const body=`
    <div class="sum">
      <p class="sum-lead">${forcado?'21:00. O segurança apagou as luzes e te mandou para casa.':h.entregas.length?`Você entregou ${h.entregas.length} demanda${h.entregas.length>1?'s':''} hoje.`:'Nenhuma entrega hoje. Amanhã é outro dia.'}</p>
      <table class="ledger">
        ${h.entregas.map(t=>`<tr><td>Entregue</td><td>${t}</td></tr>`).join('')}
        ${h.atrasos.map(t=>`<tr class="bad"><td>Atrasou</td><td>${t}: a área ficou chateada</td></tr>`).join('')}
        ${horaExtra?'<tr class="good"><td>Hora extra</td><td>o chefe notou (+2 de moral)</td></tr>':''}
        <tr><td>Ganhos com missões</td><td class="num">${brl(h.ganhos)}</td></tr>
        <tr><td>XP do dia</td><td class="num">+${h.xp}</td></tr>
        ${renda?`<tr><td>Automações</td><td class="num">${brl(renda)}</td></tr>`:''}
        ${pag?`<tr class="good"><td>Salário</td><td class="num">${brl(pag.sal)}</td></tr><tr class="bad"><td>Boletos do mês (aluguel, mercado, internet)</td><td class="num">−${brl(pag.contas)}</td></tr>`:`<tr><td>Próximo salário</td><td>em ${4-S.dia%4} dia${4-S.dia%4>1?'s':''}</td></tr>`}
        ${decimo?`<tr class="good"><td>13º salário 🎄</td><td class="num">${brl(decimo)}</td></tr>`:''}
        <tr class="total"><td>Saldo</td><td class="num">${brl(S.dinheiro)}</td></tr>
      </table>
      ${S.chefe<20?'<p class="warn">Seu Ronaldo marcou uma “conversa rápida” para amanhã. Isso nunca é bom: entregue no prazo.</p>':''}
    </div>`;
  S.dia++;S.minuto=540;S.aviso18=false;S.energia=clamp(100+(has('planta')?10:0),0,110);S.hoje={entregas:[],ganhos:0,xp:0,atrasos:[]};
  const d=deskAtual();player.x=11;player.y=14;player.px=11*T;player.py=14*T;player.dir='up';player.moving=false;
  for(const k in npcs){const n=npcs[k];n.x=n.home.x;n.y=n.home.y;n.px=n.x*T;n.py=n.y*T;n.moving=false;n.dir='down';}
  salvar();lastHud='';updateHud();
  abrirModal(`Fim do dia ${S.dia-1}`,body,[{t:`Começar o dia ${S.dia}`,primary:true,fn:()=>{fecharModal(true);comecarDia();}}],{noClose:true});
}
function comecarDia(){
  S.aniversario=ANIVERSARIOS[semana(S.dia)]||null;
  gerarMissoesDoDia();
  const cenas=[];
  const ev=eventoHoje();
  if(S.dia===1){cenas.push(['chefe','Bem-vindo(a) à Tabelão S.A., {nome}! Eu sou o Seu Ronaldo, gerente de BI.'],['chefe','Sua mesa é a bancada ali embaixo, à esquerda, do lado do Kevin. Não toque no teclado dele.'],['chefe','As demandas das áreas chegam no seu computador. Cada uma tem prazo: atrasou, a área fica chateada. E eu também.'],['chefe','Salário cai a cada 4 dias. Café fica na copa. Aumento e promoção, na minha sala… quando você merecer.'],['kevin','Oi! Eu sou o Kevin. Se o servidor cair, não fui eu.'],['eu','(Ande com as setas ou WASD. Aperte E ou Espaço perto das coisas e das pessoas para interagir.)']);}
  else{
    if(ev){if(ev.bonus){if(ev.bonus.energia)S.energia=clamp(S.energia+ev.bonus.energia,0,120);if(ev.bonus.dinheiro)S.dinheiro+=ev.bonus.dinheiro;}if(ev.cena)cenas.push(...ev.cena);}
    if(S.aniversario){cenas.push(['kevin',`Hoje é aniversário de ${NPCS[S.aniversario].nome}! Tem bolo na copa!`]);}
    if(S.chefe<20){cenas.push(['chefe','Precisamos conversar. As áreas reclamaram de atrasos.'],['chefe','Não vou te mandar embora, mas preciso ver entregas no prazo. Combinado?'],['eu','Combinado. (Moral com o chefe recuperada para 30.)']);S.chefe=30;}
    else if(!ev&&Math.random()<.5){const pend=CENAS_ALEATORIAS.filter(c=>!S.cenasVistas.includes(c));const pool=pend.length?pend:CENAS_ALEATORIAS;const c=pool[Math.floor(Math.random()*pool.length)];if(!pend.length)S.cenasVistas=[];S.cenasVistas.push(c);cenas.push(...CENAS[c]);}
  }
  lastHud='';updateHud();salvar();
  const fim=()=>{paused=false;toast(`${S.missoes.length} demanda${S.missoes.length!==1?'s':''} na sua caixa de entrada. Vá até o seu computador.`);};
  if(cenas.length)falar(cenas,fim);else fim();
}

let pcTab='inbox',pcUid=null;
const KIND={fill:'Lacunas',sql:'SQL',py:'Python',quiz:'Pergunta'};

  inPC=true;pcTab=tab||'inbox';pcUid=null;

function renderPC(){
  const nav=$('#pcNav');if(!nav)return;
  const tabs=[['inbox','Caixa de entrada',S.missoes.length],['dados','Dicionário de dados'],['hist','Entregues']];

function renderInbox(main){

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderMissao(main,e){
  const m=getM(e);const rw=rewardOf(m,e);
  const head=`<button class="back" id="pcBack">‹ Caixa de entrada</button>
   <header class="mail-h"><canvas width="44" height="44" id="mailPort"></canvas><div><div class="mail-from">${NPCS[m.from].nome} <span>${NPCS[m.from].cargo}</span></div>
   <h3>${m.title}</h3><div class="mail-meta"><span class="ib-due ${dueCls(e)}">Prazo: ${dueTxt(e).toLowerCase()}</span><span>${brl(rw.pay)} + ${rw.xp} XP${e.start===S.dia&&!e.revisao?' (+20% se entregar hoje)':''}</span><span class="tag t-${m.kind}">${KIND[m.kind]}</span></div></div></header>
   <p class="brief">${esc(m.brief)}</p>`;
  let work='';
  if(m.kind==='quiz'){
    const order=m.options.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=(e.uid*7+i*13)%(i+1);[order[i],order[j]]=[order[j],order[i]];}
    work=`<div class="quiz">${order.map(i=>`<button class="opt" data-i="${i}" ${e.tried&&e.tried.includes(i)?'disabled':''}>${esc(m.options[i])}</button>`).join('')}</div><div id="out" class="out"></div>`;
  }else{
    const lang=m.lang==='sql'?'SQL':'Python (pandas)';

    if(m.kind==='fill'){
      let k=0;const parts=m.template.split('___');const vals=e.draft||[];
      editor=`<pre class="code fill">${parts.map((p,i)=>esc(p)+(i<parts.length-1?`<input class="blank" data-b="${i}" value="${esc(vals[i]||'')}" size="${Math.max(3,m.answers[i].length+1)}" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Lacuna ${i+1}">`:'')).join('')}</pre>`;
    }else{
      editor=`<textarea id="code" class="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor de código ${lang}">${esc(e.draft!=null?e.draft:(m.starter||''))}</textarea>`;
    }
    work=`<div class="ed-head"><span>${lang}</span><span class="muted">${m.kind==='fill'?'Preencha as lacunas':'Ctrl + Enter executa'}</span></div>${editor}
      ${m.kind!=='fill'?tabelasHelper(m.lang):''}
      <div class="ed-actions"><button class="btn" id="btnRun">Executar</button><button class="btn primary" id="btnSend">Entregar</button><span class="sp"></span>
      <button class="btn ghost" id="btnHint">${has('pato')&&S.pato!==S.dia?'Perguntar ao pato (grátis)':'Pedir dica (R$ 20)'}</button><button class="btn ghost" id="btnGab">Ver gabarito</button></div>
      <div id="hint" class="hint" hidden></div><div id="out" class="out"></div>`;
  }
  main.innerHTML=head+work;
  drawPortrait($('#mailPort'),m.from);
  $('#pcBack').onclick=()=>{salvarRascunho();pcUid=null;renderPC();};
  if(m.kind==='quiz'){
    main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(S.energia<custoEnergia())return outErro('Sem energia para pensar. Vá até a copa tomar um café.');
      if(i===m.answer){mostrarSucesso(concluir(e));}
      else{e.wrong++;e.tried=(e.tried||[]).concat(i);S.energia=clamp(S.energia-3,0,100);b.disabled=true;b.classList.add('no');outErro('Não é bem isso. Pense no impacto para o negócio e tente de novo (a recompensa diminui um pouco).');lastHud='';updateHud();}
    });
    return;}
  const ta=$('#code');
  if(ta){ta.addEventListener('keydown',ev=>{
      if(ev.key==='Tab'){ev.preventDefault();const s=ta.selectionStart;ta.setRangeText('    ',s,ta.selectionEnd,'end');}
      if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();executar(m,e);}
      ev.stopPropagation();});
    setTimeout(()=>{ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);},40);}
  main.querySelectorAll('.blank').forEach((inp,i,all)=>{inp.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Enter'){ev.preventDefault();if(all[i+1])all[i+1].focus();else executar(m,e);}});if(i===0)setTimeout(()=>inp.focus(),40);});
  main.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(!ta)return;const s=ta.selectionStart;ta.setRangeText(c.dataset.ins,s,ta.selectionEnd,'end');ta.focus();});

    else{if(S.dinheiro<20)return outErro('Sem dinheiro para a dica.');S.dinheiro-=20;h.innerHTML=`<b>Dica do Fábio:</b> ${esc(m.hint)}`;}
    h.hidden=false;lastHud='';updateHud();$('#btnHint').disabled=true;};
  $('#btnGab').onclick=()=>{

}
function abrirConfirm(msg,ok){const out=$('#out');out.innerHTML=`<div class="confirm"><p>${msg}</p><button class="btn primary" id="cfOk">Ver gabarito</button><button class="btn ghost" id="cfNo">Cancelar</button></div>`;$('#cfOk').onclick=()=>{out.innerHTML='';ok();};$('#cfNo').onclick=()=>out.innerHTML='';}
function aplicarGabarito(m){
  if(m.kind==='fill'){document.querySelectorAll('.blank').forEach((inp,i)=>inp.value=m.answers[i]);}
  else{$('#code').value=m.solution;}
  $('#hint').hidden=false;$('#hint').innerHTML='<b>Gabarito aplicado.</b> Execute, entenda cada parte e entregue. Na próxima, tente sem!';

function tabelasHelper(lang){
  const q=lang==='sql';
  return `<details class="tbls"><summary>Tabelas e colunas (clique para inserir)</summary>${Object.keys(SCHEMAS).map(t=>`<div class="tb"><button class="chip tname" data-ins="${t}">${t}</button>${Object.keys(SCHEMAS[t].cols).map(c=>`<button class="chip" data-ins="${q?c:`'${c}'`}" title="${esc(SCHEMAS[t].cols[c])}">${c}</button>`).join('')}</div>`).join('')}</details>`;
}
function codigoAtual(m){
  if(m.kind==='fill'){const vals=[...document.querySelectorAll('.blank')].map(i=>i.value.trim());let i=0;return {code:m.template.replace(/___/g,()=>vals[i++]||'___'),vals};}

function salvarRascunho(){
  if(!pcUid)return;const e=S.missoes.find(x=>x.uid===pcUid);if(!e)return;const m=getM(e);if(!m||m.kind==='quiz')return;
  if(m.kind==='fill'){const b=document.querySelectorAll('.blank');if(b.length)e.draft=[...b].map(i=>i.value);}

}
function outErro(msg){const o=$('#out');if(o)o.innerHTML=`<div class="err">${esc(msg)}</div>`;}
function rodar(m){
  const {code,vals}=codigoAtual(m);
  if(m.kind==='fill'&&vals.some(v=>!v)){outErro('Preencha todas as lacunas.');return null;}
  try{return runCode(m.lang,code);}catch(err){outErro(err.message||String(err));return null;}
}
function executar(m,e){salvarRascunho();const r=rodar(m);if(!r)return;$('#out').innerHTML=renderSaida(r);}
function entregar(m,e){
  salvarRascunho();
  if(S.energia<custoEnergia()){outErro(`Sem energia (precisa de ${custoEnergia()}). Vá até a copa tomar um café.`);return;}
  const r=rodar(m);if(!r)return;
  if(!r.hasResult){outErro('Seu código não devolveu resultado. Deixe a expressão final na última linha (sem atribuir a uma variável) ou use print().');return;}
  let exp;try{exp=expected(m);}catch(err){outErro('Erro interno ao conferir. Tente executar de novo.');return;}
  const c=compareResults(r.result,exp,m.ordered);
  if(!c.ok){e.wrong++;S.energia=clamp(S.energia-3,0,100);lastHud='';updateHud();
    $('#out').innerHTML=`<div class="err"><b>${NPCS[m.from].nome} devolveu:</b> “Não é isso que eu pedi.” ${esc(c.msg)}</div>`+renderSaida(r);return;}
  mostrarSucesso(concluir(e));
}

  toast(`Entregue: ${m.title}. +${brl(pay)}`,'good');
}
function fmtCell(v){if(v===null||v===undefined||(typeof v==='number'&&isNaN(v)))return'<span class="nan">NaN</span>';if(typeof v==='number')return Number.isInteger(v)?v.toLocaleString('pt-BR'):(Math.round(v*100)/100).toLocaleString('pt-BR');if(typeof v==='boolean')return v?'True':'False';return esc(v);}
function tabelaHTML(cols,rows,idx){
  const max=25;const shown=rows.slice(0,max);
  return `<div class="tbl-wrap"><table class="res"><thead><tr>${idx?`<th class="ix">${esc(idx.name||'')}</th>`:''}${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${shown.map((r,i)=>`<tr>${idx?`<td class="ix">${fmtCell(idx.vals[i])}</td>`:''}${cols.map(c=>`<td>${fmtCell(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length>max?`<p class="muted small">… mais ${rows.length-max} linhas</p>`:''}<p class="muted small">${rows.length} linha${rows.length!==1?'s':''} × ${cols.length} coluna${cols.length!==1?'s':''}</p>`;
}
function renderValor(v){
  if(v instanceof DF)return tabelaHTML(v.cols,v.rows,null);
  if(v instanceof Series){const nm=v.name==null?'':String(v.name);
    return tabelaHTML([nm||'valor'],v.values.map(x=>({[nm||'valor']:x})),{name:v.indexName||'',vals:v.index});}
  if(v instanceof GroupBy)return `<div class="val">&lt;DataFrameGroupBy&gt; <span class="muted">Falta agregar: use .sum(), .mean(), .count()…</span></div>`;
  if(v instanceof Bound)return `<div class="val">&lt;método ${esc(v.name)}&gt; <span class="muted">Faltou abrir e fechar parênteses: ${esc(v.name)}()</span></div>`;
  return `<div class="val">${esc(fmtScalar(v))}</div>`;
}
function renderSaida(r){
  let h='';(r.prints||[]).forEach(p=>{if(p!==r.result)h+=renderValor(p);});
  if(r.hasResult)h+=renderValor(r.result);else if(!h)h='<div class="val muted">(sem saída)</div>';
  return `<div class="out-label">Resultado</div>`+h;
}
function renderDados(main){
  main.innerHTML=`<p class="muted">Estas são as tabelas da Tabelão S.A. Em SQL use o nome direto (FROM vendas). Em Python elas já estão carregadas como DataFrames: vendas, clientes, campanhas, entregas.</p>`+
  Object.keys(SCHEMAS).map(t=>{const df=new DF(Object.keys(DATA[t][0]),DATA[t].slice(0,6));return `<section class="dict"><h4>${t} <span class="muted">${DATA[t].length} linhas</span></h4><p>${SCHEMAS[t].desc}</p>
    <dl>${Object.entries(SCHEMAS[t].cols).map(([c,d])=>`<div><dt>${c}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl>
    <details><summary>Ver as primeiras linhas</summary>${tabelaHTML(df.cols,df.rows,null)}</details></section>`;}).join('');
}
function renderHist(main){
  if(!S.histor.length){main.innerHTML='<div class="empty-state"><p>Nada entregue ainda.</p><p class="muted">Suas entregas aparecem aqui.</p></div>';return;}
  main.innerHTML=`<table class="ledger hist">${S.histor.map(h=>`<tr><td>Dia ${h.dia}</td><td>${esc(h.t)}<small>${NPCS[h.from].nome}</small></td><td class="num">${brl(h.pay)}</td><td class="num">${h.xp} XP</td></tr>`).join('')}</table>`;
}

/* ================= LOJA ================= */
let lojaTab='roupas';
function abrirLoja(tab){lojaTab=tab||lojaTab;abrirModal('Loja do celular','<div class="shop"><nav class="shop-nav" id="shopNav"></nav><div id="shopList" class="shop-list"></div></div>',[],{wide:true});renderLoja();}
function reqAuto(a){const r=a.req;const f=[];if(r.py&&lvl(S.skills.py)<r.py)f.push(`Python nv ${r.py}`);if(r.sql&&lvl(S.skills.sql)<r.sql)f.push(`SQL nv ${r.sql}`);if(r.negocio&&lvl(S.skills.negocio)<r.negocio)f.push(`Negócio nv ${r.negocio}`);if(r.feitos&&S.recFeitos[a.rec]<r.feitos)f.push(`${r.feitos} entregas do ${RECORRENTES[a.rec].nome.toLowerCase()} (${S.recFeitos[a.rec]}/${r.feitos})`);return f;}
function renderLoja(){
  if(!$('#shopNav'))return;
  const tabs=[['roupas','Roupas'],['acessorios','Acessórios'],['mesa','Mesa'],['cursos','Cursos'],['automacoes','Automações']];
  $('#shopNav').innerHTML=tabs.map(([k,n])=>`<button class="${lojaTab===k?'on':''}" data-k="${k}">${n}</button>`).join('')+`<span class="shop-money">${brl(S.dinheiro)}</span>`;
  $('#shopNav').querySelectorAll('button').forEach(b=>b.onclick=()=>{lojaTab=b.dataset.k;renderLoja();});
  const items=LOJA[lojaTab];
  $('#shopList').innerHTML=(lojaTab==='automacoes'?'<p class="muted">Automações trabalham por você todos os dias: geram renda, melhoram a reputação da área e eliminam relatórios recorrentes da sua caixa.</p>':lojaTab==='cursos'?'<p class="muted">Cursos dão XP direto na habilidade. Alguns exigem cargo mínimo.</p>':'')+
  items.map(it=>{
    let btn='',st='',extra='';
    if(lojaTab==='roupas'){if(S.roupa===it.id){btn='Vestindo';st='disabled';}else if(has(it.id))btn='Vestir';else btn=`Comprar ${brl(it.preco)}`;}
    else if(lojaTab==='acessorios'){if(has(it.id))btn=S.acess.includes(it.id)?'Tirar':'Usar';else btn=`Comprar ${brl(it.preco)}`;}
    else if(lojaTab==='mesa'){if(has(it.id)){btn='Na sua mesa';st='disabled';}else btn=`Comprar ${brl(it.preco)}`;}
    else if(lojaTab==='cursos'){if(S.cursos.includes(it.id)){btn='Concluído';st='disabled';}else if(it.min&&S.cargo<it.min){btn=`Exige ${CARREIRA[it.min].nome}`;st='disabled';}else btn=`Matricular ${brl(it.preco)}`;}
    else{if(S.autos.includes(it.id)){btn=`Rodando · ${brl(it.renda)}/dia`;st='disabled';}else{const f=reqAuto(it);if(f.length){btn='Bloqueada';st='disabled';extra=`<p class="req">Precisa de: ${f.join(', ')}</p>`;}else btn=`Implantar ${brl(it.preco)}`;}}
    const pobre=btn.startsWith('Comprar')||btn.startsWith('Matricular')||btn.startsWith('Implantar');
    if(pobre&&S.dinheiro<it.preco){st='disabled';}
    return `<div class="item">${lojaTab==='roupas'?`<canvas width="28" height="28" data-roupa="${it.id}"></canvas>`:''}<div class="item-t"><b>${it.nome}</b><p>${it.desc}${lojaTab==='automacoes'?` Renda: ${brl(it.renda)} por dia.`:''}</p>${extra}</div><button class="btn${pobre?' primary':''}" data-id="${it.id}" ${st}>${btn}</button></div>`;}).join('');
  $('#shopList').querySelectorAll('canvas[data-roupa]').forEach(c=>{const it=LOJA.roupas.find(x=>x.id===c.dataset.roupa);const cc=c.getContext('2d');cc.imageSmoothingEnabled=false;const L={...lookOf('eu'),shirt:it.shirt,jacket:it.jacket,tie:it.tie,collar:it.collar,hood:it.hood,print:it.print};drawChar(cc,2,2,L,'down',0,2);});
  $('#shopList').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>comprar(lojaTab,b.dataset.id));
}
function comprar(tab,id){
  const it=LOJA[tab].find(x=>x.id===id);
  if(tab==='roupas'&&has(id)){S.roupa=id;toast(`Vestindo: ${it.nome}.`);}
  else if(tab==='acessorios'&&has(id)){S.acess=S.acess.includes(id)?S.acess.filter(x=>x!==id):[...S.acess,id];}
  else{
    if(S.dinheiro<it.preco)return;S.dinheiro-=it.preco;
    if(tab==='cursos'){S.cursos.push(id);S.skills[it.skill]+=it.xp;if(it.extra)for(const k in it.extra)S.skills[k]+=it.extra[k];toast(`Curso concluído: ${it.nome}. +${it.xp} XP.`,'good');}
    else if(tab==='automacoes'){S.autos.push(id);if(it.rec)S.missoes=S.missoes.filter(e=>!e.ref.startsWith('rec:'+it.rec));buildMap();toast(`${it.nome} implantada! Renda de ${brl(it.renda)} por dia.`,'gold');confete();}
    else{S.owned.push(id);if(tab==='roupas')S.roupa=id;if(tab==='acessorios')S.acess.push(id);toast(`Comprado: ${it.nome}.`,'good');}
  }
  salvar();lastHud='';updateHud();renderLoja();
}

/* ================= CARREIRA ================= */
function abrirCarreira(){
  const p=podePromover();const prox=CARREIRA[S.cargo+1];
  const reqRows=prox?(()=>{const r=prox.req;const rows=[];
    const add=(n,cur,need,txt)=>rows.push(`<li class="${cur>=need?'ok':''}"><span>${n}</span><div class="bar"><i style="width:${Math.min(100,cur/need*100)}%"></i></div><span class="num">${txt||`${cur}/${need}`}</span></li>`);
    add('XP total',S.xp,r.xp);add('Entregas',S.totalFeitas,r.missoes);
    if(r.sql)add('SQL',lvl(S.skills.sql),r.sql,`nv ${lvl(S.skills.sql)}/${r.sql}`);if(r.py)add('Python',lvl(S.skills.py),r.py,`nv ${lvl(S.skills.py)}/${r.py}`);
    if(r.negocio)add('Negócio',lvl(S.skills.negocio),r.negocio,`nv ${lvl(S.skills.negocio)}/${r.negocio}`);if(r.com)add('Comunicação',lvl(S.skills.com),r.com,`nv ${lvl(S.skills.com)}/${r.com}`);
    if(r.rep)add('Reputação média',avgRep(),r.rep);if(r.auto)add('Automações',S.autos.length,r.auto);return rows.join('');})():'';
  const body=`<div class="career">
    <ol class="ladder">${CARREIRA.map((c,i)=>`<li class="${i<S.cargo?'past':i===S.cargo?'now':''}"><b>${c.nome}</b><span>${brl(c.salario)}</span></li>`).join('')}</ol>
    <div class="career-r">
      ${prox?`<h4>Para virar ${prox.nome}</h4><ul class="reqs">${reqRows}</ul><p class="muted">${p.ok?'Tudo pronto. Vá até a sala do Seu Ronaldo e peça a promoção.':'Quando tudo estiver completo, peça a promoção ao chefe.'}</p>`:'<h4>Topo da carreira!</h4><p>Você é Head de Dados. Agora o desafio é manter as áreas felizes e as automações rodando.</p>'}
      <h4>Reputação com as áreas</h4><ul class="reqs">${DEPTS.map(d=>`<li class="${S.rep[d]>=60?'ok':''}"><span>${d}</span><div class="bar"><i style="width:${S.rep[d]}%"></i></div><span class="num">${S.rep[d]}</span></li>`).join('')}
      <li><span>Moral com o chefe</span><div class="bar"><i style="width:${S.chefe}%"></i></div><span class="num">${S.chefe}</span></li></ul>
      <p class="muted small">Reputação sobe com entregas e conversas; cai com atrasos. Aumento de salário depende da moral com o chefe e da reputação.</p>
    </div></div>`;
  abrirModal('Plano de carreira',body,[],{wide:true});
}

   <p>Você começa como estagiário(a) na Tabelão S.A. As áreas (Marketing, Vendas, Operações e Financeiro) mandam demandas para o seu computador. Resolva com SQL, pandas e raciocínio de negócio, cumpra os prazos e suba na carreira.</p>

   </dl>
   <p class="muted small">O Python aqui é um simulador do pandas que roda no seu navegador: cobre filtros, groupby, agg, merge, pivot_table, value_counts, sort_values e mais. O SQL roda num banco em memória (AlaSQL).</p>
  </div>`,[{t:'Recomeçar do zero',fn:()=>{if(confirm('Apagar todo o progresso e começar de novo?')){try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();}}},{t:'Voltar ao jogo',primary:true,fn:()=>fecharModal()}],{});
}

/* ================= TELA INICIAL ================= */
const SKINS=['#f2d0b0','#e0ac7e','#b97a50','#8a5534','#5c3a24'];
const HAIRS=['#2b1d14','#5a3a1e','#c9932f','#9a2f1e','#d8d8d8','#4b6fd6'];
const STYLES=[['curto','Curto'],['longo','Longo'],['careca','Careca']];
function telaInicial(sv){
  const tmp={skin:SKINS[1],hair:HAIRS[0],style:'curto'};
  const body=`<div class="start">
    <div class="start-hero"><h1>SELECT * FROM carreira</h1><p>Do estagiário ao Head de Dados. Resolva demandas reais de Marketing, Vendas, Operações e Financeiro com SQL e pandas, cumpra prazos e sobreviva ao escritório.</p></div>
    ${sv?`<div class="cont"><p>Você tem um jogo salvo: <b>${esc(sv.nome)}</b>, ${CARREIRA[sv.cargo].nome}, dia ${sv.dia}.</p><button class="btn primary" id="stCont" autofocus>Continuar</button></div><h4>Ou comece de novo</h4>`:''}
    <div class="creator">
      <canvas id="stPrev" width="56" height="84"></canvas>
      <div class="cr-f">
        <label for="stNome">Seu nome no crachá</label><input id="stNome" maxlength="16" value="" placeholder="Ex.: Ana" autocomplete="off" ${sv?'':'autofocus'}>
        <span class="lbl">Tom de pele</span><div class="sw" id="swSkin">${SKINS.map((c,i)=>`<button style="background:${c}" data-v="${c}" aria-label="Tom ${i+1}" class="${c===tmp.skin?'on':''}"></button>`).join('')}</div>
        <span class="lbl">Cabelo</span><div class="sw" id="swHair">${HAIRS.map((c,i)=>`<button style="background:${c}" data-v="${c}" aria-label="Cor ${i+1}" class="${c===tmp.hair?'on':''}"></button>`).join('')}</div>
        <div class="seg" id="swStyle">${STYLES.map(([k,n])=>`<button data-v="${k}" class="${k===tmp.style?'on':''}">${n}</button>`).join('')}</div>
      </div>
    </div></div>`;
  abrirModal('Tabelão S.A.',body,[{t:'Começar o primeiro dia',primary:!sv,fn:()=>{const nome=($('#stNome').value||'').trim()||'Analista';if(sv&&!confirm('Começar de novo apaga o jogo salvo. Continuar?'))return;fecharModal(true);entrar(novoEstado(nome,tmp),true);}}],{noClose:true,wide:true});
  const prev=()=>{const c=$('#stPrev'),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);drawChar(x,4,6,{skin:tmp.skin,hair:tmp.hair,style:tmp.style,shirt:'#5aa0d8',pants:'#2b3550'},'down',0,4);};
  const bind=(id,key)=>$('#'+id).querySelectorAll('button').forEach(b=>b.onclick=()=>{tmp[key]=b.dataset.v;$('#'+id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));prev();});
  bind('swSkin','skin');bind('swHair','hair');bind('swStyle','style');prev();
  $('#stNome').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')$('#modalActions button').click();});
  if(sv)$('#stCont').onclick=()=>{fecharModal(true);entrar(sv,false);};
}
function entrar(st,novo){
  S=st;S.hoje=S.hoje||{entregas:[],ganhos:0,xp:0,atrasos:[]};
  player={id:'player',x:S.pos.x,y:S.pos.y,px:S.pos.x*T,py:S.pos.y*T,dir:S.dir||'up',moving:false};
  buildMap();
  if(blocked(player.x,player.y,'player')){player.x=11;player.y=14;player.px=11*T;player.py=14*T;}
  lastHud='';updateHud();
  if(novo)comecarDia();else{paused=false;toast(`Bem-vindo(a) de volta, ${S.nome}. Dia ${S.dia}, ${horaStr(S.minuto)}.`);}
}

/* ================= CONTROLES ================= */
window.addEventListener('keydown',e=>{
  if(!S)return;
  const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea';
  if(!$('#dialog').hidden&&!typing){
    if(['KeyE','Space','Enter'].includes(e.code)){if(document.activeElement&&document.activeElement.classList.contains('choice'))return;e.preventDefault();avancar();}
    return;}
  if(modalAberto()){if(e.key==='Escape')fecharModal();return;}
  if(typing)return;
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(['KeyE','Space','Enter'].includes(e.code)&&!e.repeat)interagir();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{keys={};});
document.querySelectorAll('.dpad [data-d]').forEach(b=>{
  const k='d'+b.dataset.d;
  const on=ev=>{ev.preventDefault();keys[k]=true;b.classList.add('on');try{b.setPointerCapture(ev.pointerId);}catch(_){}};
  const off=()=>{keys[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});
$('#btnA').addEventListener('click',()=>{if(!S)return;if(!$('#dialog').hidden)return avancar();if(!modalAberto())interagir();});
$('#dialog').addEventListener('click',e=>{if(e.target.closest('.choice'))return;avancar();});
$('#modalClose').onclick=()=>fecharModal();
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')fecharModal();});
$('#btnLoja').onclick=()=>{if(S&&$('#dialog').hidden)abrirLoja();};
$('#btnCarreira').onclick=()=>{if(S&&$('#dialog').hidden)abrirCarreira();};
$('#btnAjuda').onclick=()=>{if(S&&$('#dialog').hidden)abrirAjuda();};
$('#btnPC').onclick=()=>{if(S&&$('#dialog').hidden)toast('Vá até o seu computador para trabalhar nas demandas (a mesa com o monitor azul).');};
setInterval(()=>{if(S&&!paused)salvar();},8000);
window.addEventListener('pagehide',()=>salvar());
document.fonts&&document.fonts.ready.then(()=>{lastHud='';});
telaInicial(carregar());
requestAnimationFrame(loop);

</script>
